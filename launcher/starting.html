<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starting TLDR.video...</title>
<style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #3a6ea5; font-family: Tahoma, 'Segoe UI', sans-serif; }
    .dialog { width: 380px; background: #ece9d8; border: 2px solid #0058e6; border-radius: 5px;
              box-shadow: 4px 4px 10px rgba(0,0,0,0.3); }
    .header { background: linear-gradient(180deg, #0058e6 0%, #3a8cff 10%, #0058e6 90%, #003399 100%);
              color: #fff; padding: 6px 10px; font-size: 13px; font-weight: bold; }
    .content { padding: 20px; text-align: center; font-size: 12px; color: #222; }
    .spinner { width: 36px; height: 36px; border: 4px solid #ddd; border-top-color: #0066cc;
               border-radius: 50%; margin: 0 auto 14px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { color: #666; font-size: 11px; margin-top: 10px; }
    a { color: #0066cc; }
</style>
</head>
<body>
<div class="dialog">
    <div class="header">TLDR.video</div>
    <div class="content">
        <div class="spinner" id="spinner"></div>
        <p id="message">Starting the server&hellip;</p>
        <p class="hint" id="hint">This page opens the app automatically when it's ready.<br>
        The first launch installs dependencies and can take a few minutes.</p>
    </div>
</div>
<script>
    // Poll the server by loading a tiny image; works from a file:// page in every browser.
    const APP_URL = 'http://localhost:8000/';
    const started = Date.now();
    function check() {
        const img = new Image();
        img.onload = () => location.replace(APP_URL);
        img.onerror = () => {
            const mins = (Date.now() - started) / 60000;
            if (mins > 15) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('message').textContent = 'The server has not started.';
                document.getElementById('hint').innerHTML =
                    'Check the Terminal window for errors, then <a href="' + APP_URL + '">try again</a>.';
                return;
            }
            setTimeout(check, 1500);
        };
        img.src = APP_URL + 'static/favicon.png?t=' + Date.now();
    }
    check();
</script>
</body>
</html>
